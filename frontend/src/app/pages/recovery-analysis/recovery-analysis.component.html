<div class="page-recovery">
  <h1 class="page-title">Recovery Analysis</h1>

  <div class="stock-tabs">
    @for (s of stocks(); track s.id) {
      <button
        class="stock-tab"
        [class.active]="selectedStockId === s.id"
        (click)="onStockChange(s.id)"
      >
        {{ s.ticker }}
      </button>
    }
  </div>

  @if (isLoading()) {
    <div class="loading-wrap">
      <mat-spinner diameter="40"></mat-spinner>
    </div>
  } @else {
    <mat-card class="data-card">
      <mat-card-header><mat-card-title>Dividendi storici</mat-card-title></mat-card-header>
      <mat-card-content>
        <table mat-table [dataSource]="dividends()" class="data-table">
          <ng-container matColumnDef="ex_date">
            <th mat-header-cell *matHeaderCellDef>Ex-Date</th>
            <td mat-cell *matCellDef="let row">{{ row.ex_date }}</td>
          </ng-container>
          <ng-container matColumnDef="amount">
            <th mat-header-cell *matHeaderCellDef>Importo</th>
            <td mat-cell *matCellDef="let row">{{ row.amount | currency:'EUR':'symbol':'1.3-3':'it' }}</td>
          </ng-container>
          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Stato</th>
            <td mat-cell *matCellDef="let row">
              <span class="status-badge" [class.confirmed]="row.status === 'CONFIRMED'">{{ row.status }}</span>
            </td>
          </ng-container>
          <ng-container matColumnDef="confidence">
            <th mat-header-cell *matHeaderCellDef>Confidenza</th>
            <td mat-cell *matCellDef="let row">{{ row.confidence | percent:'1.0-0':'it' }}</td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </mat-card-content>
    </mat-card>
  }
</div>
