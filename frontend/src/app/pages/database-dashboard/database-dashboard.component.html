<div class="page-database">
  <h1 class="page-title">Database Explorer</h1>

  @if (isLoading()) {
    <div class="loading-wrap">
      <mat-spinner diameter="40"></mat-spinner>
      <p>Caricamento...</p>
    </div>
  } @else {
    <mat-card class="data-card">
      <mat-card-header><mat-card-title>Stocks</mat-card-title></mat-card-header>
      <mat-card-content>
        <table mat-table [dataSource]="stocks()" class="data-table">
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>ID</th>
            <td mat-cell *matCellDef="let row">{{ row.id }}</td>
          </ng-container>
          <ng-container matColumnDef="ticker">
            <th mat-header-cell *matHeaderCellDef>Ticker</th>
            <td mat-cell *matCellDef="let row">{{ row.ticker }}</td>
          </ng-container>
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let row">{{ row.name }}</td>
          </ng-container>
          <ng-container matColumnDef="market">
            <th mat-header-cell *matHeaderCellDef>Market</th>
            <td mat-cell *matCellDef="let row">{{ row.market || '—' }}</td>
          </ng-container>
          <ng-container matColumnDef="sector">
            <th mat-header-cell *matHeaderCellDef>Sector</th>
            <td mat-cell *matCellDef="let row">{{ row.sector || '—' }}</td>
          </ng-container>
          <ng-container matColumnDef="currency">
            <th mat-header-cell *matHeaderCellDef>Currency</th>
            <td mat-cell *matCellDef="let row">{{ row.currency }}</td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </mat-card-content>
    </mat-card>
  }
</div>
